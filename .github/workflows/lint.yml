name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: "package.json"
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run test & coverage
        run: pnpm test:coverage --coverage.reporter=json-summary
        timeout-minutes: 10
      
      - name: Update Coverage Status
        # Run only for PRs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const isSuccess = github.context.payload.workflow_run
              ? github.context.payload.workflow_run.conclusion === 'success'
              : github.context.payload.check_suite
              ? github.context.payload.check_suite.conclusion === 'success'
              : false;
            // 1. read coverage summary
            const fs = require('fs');
            const summaryPath = './coverage/coverage-summary.json';
            
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found.');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            // 2. Total coverage % calc
            const total = summary.total.lines.pct; 
            const color = total >= 50 && isSuccess ? 'success' : 'failure'; // Green if >= 50%, just check 
            const description = `Lines: ${total}% | Statements: ${summary.total.statements.pct}%`;
            console.log(`Coverage Status: ${description}, State: ${color}, Succeed: ${isSuccess}`);

            // 3. Github PR checklist update
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: color, // Build is success
              context: 'Vitest Coverage', // List name
              description: description, // e.g. "Lines: 85%"
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` // Click to see details
            });

